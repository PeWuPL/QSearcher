<!DOCTYPE html>
<!doctype html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../common/bootstrap.css">
	<link rel="stylesheet" href="settings.css">
	<!--	<link rel="stylesheet" href="settings.css">-->
	<script defer src="../common/bootstrap.bundle.min.js"></script>
	<script defer src="functions.js"></script>
	<script defer src="settings.js"></script>
	<title>QSearcher - ustawienia</title>
</head>
<body class="container">
	<!-- MODALS -->

	<h1>Ustawienia globalne</h1>
	<hr>
	<fieldset class="container mb-3 pb-3 border border-secondary rounded">
		<legend class="float-none w-auto px-3">Baza pytań</legend>

		<fieldset class="container mb-3 pb-3 border border-secondary rounded">
			<legend class="float-none w-auto px-3">Predefiniowane bazy</legend>
			<div class="row p-3">
				<div class="card m-1 p-3" style="width: 18rem;">
					<h5 class="card-title">Systemy Multimedialne</h5>
					<h6 class="card-subtitle mb-2 text-body-secondary">Semestr 6</h6>
					<div class="card-body">
						<p class="card-text">Baza pytań do systemów multimedialnych - semestr 6</p>
						<a href="#" class="btn btn-primary" id="load-sm">Wybierz</a>
					</div>
				</div>

<!--				<div class="card m-1 p-3" style="width: 18rem;">-->
<!--					<h5 class="card-title">Transmisja danych</h5>-->
<!--					<h6 class="card-subtitle mb-2 text-body-secondary">Semestr 5</h6>-->
<!--					<div class="card-body">-->
<!--						<p class="card-text">Baza pytań do transmisji danych - semestr 5</p>-->
<!--						<a href="#" class="btn btn-primary" id="load-td">Wybierz</a>-->
<!--					</div>-->
<!--				</div>-->
			</div>
		</fieldset>

		<fieldset class="container mb-3 pb-3 border border-secondary rounded">
			<legend class="float-none w-auto px-3">Własna baza</legend>

			<label for="custom-json-url" class="form-label">Ładowanie z URL</label><br>
			<input type="text" id="custom-json-url" class="form-control" placeholder="https://url.here" required/>
			<button id="load-custom-json-url" class="btn btn-primary">Pobierz</button>
			<br><br>
			<label for="custom-json-body" class="form-label">Ładowanie z JSON</label><br>
			<textarea type="text" id="custom-json-body" class="form-control" placeholder=
'[
	{
		"question": "Ala ma",
			"incorrect-answers": [
			"mruczka"
		],
		"correct-answers": [
			"kota"
		]
	}
]' required></textarea>
			<button id="load-custom-json-body" class="btn btn-primary">Ładuj</button>
		</fieldset>

		<fieldset class="container mb-3 pb-3 border border-secondary rounded">
			<legend class="float-none w-auto px-3">Status</legend>
			<span id="status-all" class="badge text-bg-primary">0</span>
			<span class="text-primary">Pytań w bazie</span><br>
			<button id="clear-database" class="btn btn-warning">Wyczyść bazę danych</button>

		</fieldset>
	</fieldset>

	<fieldset class="container mb-3 pb-3 border border-secondary rounded">
		<legend class="float-none w-auto px-3">Opcje</legend>

		<div class="form-check">
			<input class="form-check-input" type="checkbox" id="remove-diacritics-in-search">
			<label class="form-check-label" for="remove-diacritics-in-search">
				Zastępuj znaki diakrytyczne znakami ASCII (np. <code>ł</code> -> <code>l</code>)
			</label>
		</div>
	</fieldset>
</body>
</html>
